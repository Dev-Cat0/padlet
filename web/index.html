<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://padlet-sender-panel.onrender.com; object-src 'none'; base-uri 'self'; form-action 'none'"><title>Padlet Sender</title><link rel="stylesheet" href="./style.css?v=all-sections-1"><script src="./app.js?v=all-sections-1" defer></script></head><body><main><header><a href="./" class="brand">p↗</a><span>PADLET SENDER</span><span id="connection">서버 연결 중</span></header><section class="intro"><p class="eyebrow">ANONYMOUS BOT</p><h1>입력하고, 실행.</h1><p>봇이 별도의 익명 세션으로 전송합니다. 사용자는 로그인 상태를 바꿀 필요가 없습니다.</p></section><div id="notice" class="notice" role="alert" hidden></div><div class="workspace"><section class="card"><h2>전송 설정</h2><form id="sendForm"><label>게시판 주소<input id="url" type="url" required placeholder="https://padlet.com/..." maxlength="2000"></label><label>제목<input id="subject" maxlength="1000" placeholder="게시글 제목"></label><label>내용<textarea id="body" rows="5" maxlength="20000" placeholder="게시글 내용"></textarea></label><div class="split"><label>섹션당 게시물 개수<input id="limit" type="number" min="0" max="1000000" step="1" value="50" required><small>모든 섹션에 각각 이 개수만큼 · 0은 무제한</small></label><label>전송 간격 (초)<input id="delay" type="number" min="0" max="86400" step="any" value="0.3" required><small>매 주기 모든 섹션에 1개씩 동시 전송</small></label></div><div class="actions"><button id="start" type="submit" class="primary" disabled>▶ 실행</button><button id="stop" type="button" disabled>■ 중지</button></div></form></section><section class="card monitor"><h2>실행 현황</h2><div class="stats"><div><span>전송 성공</span><strong id="sent">0</strong></div><div><span>오류</span><strong id="errors">0</strong></div></div><p id="phase">시작 대기</p><progress id="progress" max="100" value="0"></progress><p id="board"></p><div id="log" role="log" aria-live="polite"></div></section></div><p class="footnote">전송은 서버에서 진행됩니다. 멈추려면 중지를 누르세요. 게시판이 익명 글쓰기를 막거나 보안 확인을 요구하면 사유를 표시하고 중단합니다.</p><footer>PADLET SENDER <span>BOT SESSION · ANONYMOUS</span></footer></main></body></html>
