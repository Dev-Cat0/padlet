name: Server checks
on:
  push:
    paths: ['server/**', 'keybot/**', 'web/**', 'tests/**', 'requirements*.txt', 'Dockerfile', 'firebase.json', 'firestore.*', '.github/workflows/test.yml']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --global firebase-tools@15.34.1
      - run: firebase emulators:exec --only firestore --project demo-padlet-key-tests "python -m pytest -q"
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
      - run: python tests/ui_smoke.py
      - run: python tests/automatic_smoke.py
      - run: python tests/password_smoke.py
